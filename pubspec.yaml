publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  supabase_flutter: ^2.3.1
  fl_chart: ^0.65.0
  image_picker: ^1.0.4
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  equatable: ^2.0.5
